name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.zod }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lockfile: the lower end of the zod peer range, zod 3.25.
          - zod: zod3
          # The upper end: zod 4.
          - zod: zod4
            zod-version: 4.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Use zod ${{ matrix.zod-version }}
        if: matrix.zod-version
        run: |
          sed -i 's|^  zod: .*|  zod: ${{ matrix.zod-version }}|' pnpm-workspace.yaml
          git diff pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install ${{ matrix.zod-version && '--no-frozen-lockfile' || '--frozen-lockfile' }}
      - run: pnpm checkTypes
      - run: pnpm test --run
      - run: pnpm -F @crescendolab/zodios-react-query-v5 build
      # The declarations must take zod types from the Zodios client, and must
      # name the Zodios client by its published name.
      - name: Check the imports in the declarations
        run: |
          if grep -nE "from ['\"](zod|@zodios/core)(/[^'\"]*)?['\"]" packages/core/dist/index.d.ts; then
            echo "dist/index.d.ts imports zod or @zodios/core" >&2
            exit 1
          fi
